<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f8fafc;color:#0f172a;font-family:Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;">
    <tr>
      <td style="padding:24px 28px;background:#0f172a;color:#ffffff;">
        <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.75;">Order Event</p>
        <h1 style="margin:0;font-size:24px;line-height:1.3;">Order <span th:text="${payload.orderId}">#12345</span> created</h1>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 28px;">
        <p style="margin:0 0 16px;font-size:15px;line-height:1.6;">
          A new order was created for
          <strong th:text="${payload.customer != null ? payload.customer.name : 'Unknown customer'}">Customer Name</strong>.
        </p>

        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 20px;border-collapse:collapse;">
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid #e2e8f0;font-size:14px;color:#475569;">Order ID</td>
            <td style="padding:10px 0;border-bottom:1px solid #e2e8f0;font-size:14px;color:#0f172a;text-align:right;" th:text="${payload.orderId}">#12345</td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid #e2e8f0;font-size:14px;color:#475569;">Total</td>
            <td style="padding:10px 0;border-bottom:1px solid #e2e8f0;font-size:14px;color:#0f172a;text-align:right;" th:text="${payload.total}">99.99</td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid #e2e8f0;font-size:14px;color:#475569;">Occurred At</td>
            <td style="padding:10px 0;border-bottom:1px solid #e2e8f0;font-size:14px;color:#0f172a;text-align:right;" th:text="${occurredAt}">2026-04-08T08:00:00Z</td>
          </tr>
          <tr>
            <td style="padding:10px 0;font-size:14px;color:#475569;">Event Type</td>
            <td style="padding:10px 0;font-size:14px;color:#0f172a;text-align:right;" th:text="${eventType}">order.created</td>
          </tr>
        </table>

        <div th:if="${payload.items != null}" style="margin:0 0 20px;">
          <h2 style="margin:0 0 12px;font-size:16px;color:#0f172a;">Items</h2>
          <ul style="margin:0;padding-left:20px;color:#334155;font-size:14px;line-height:1.6;">
            <li th:each="item : ${payload.items}">
              <span th:text="${item.name}">Product</span>
              <span th:text="${item.quantity != null ? ' x' + item.quantity : ''}"></span>
            </li>
          </ul>
        </div>

        <p style="margin:0;font-size:13px;line-height:1.6;color:#64748b;">
          Delivery ID:
          <span th:text="${deliveryId}">delivery-id</span>
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
